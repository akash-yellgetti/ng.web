<mat-form-field appearance="fill"  class="custom-form-control" [formGroup]="form">
    <mat-label>{{ label }}</mat-label>
    <input matInput [matAutocomplete]="auto" [formControlName]="controlName">
    <mat-autocomplete #auto="matAutocomplete">
      <mat-option *ngFor="let option of filteredOptions | async" [value]="option.value">
        {{ option.value }}
      </mat-option>
    </mat-autocomplete>
</mat-form-field>
