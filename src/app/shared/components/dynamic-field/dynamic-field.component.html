
<ng-container [ngSwitch]="field.type" [formGroup]="form"  >
  <mat-form-field appearance="fill" *ngSwitchCase="'text'" class="custom-form-control">
    <mat-label>{{ field.label }}</mat-label>
    <input matInput [formControlName]="field.name">
    <mat-error *ngIf="form.get(field.name)?.invalid">
      {{ getErrorMessage() }}
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill" *ngSwitchCase="'email'" class="custom-form-control">
    <mat-label>{{ field.label }}</mat-label>
    <input matInput type="email" [formControlName]="field.name">
    <mat-error *ngIf="form.get(field.name)?.invalid">
      {{ getErrorMessage() }}
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill" *ngSwitchCase="'number'" class="custom-form-control">
    <mat-label>{{ field.label }}</mat-label>
    <input matInput type="number" [formControlName]="field.name">
    <mat-error *ngIf="form.get(field.name)?.invalid">
      {{ getErrorMessage() }}
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill" *ngSwitchCase="'textarea'" class="custom-form-control">
    <mat-label>{{ field.label }}</mat-label>
    <textarea matInput [formControlName]="field.name"></textarea>
    <mat-error *ngIf="form.get(field.name)?.invalid">
      {{ getErrorMessage() }}
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill" *ngSwitchCase="'select'" class="custom-form-control">
    <mat-label>{{ field.label }}</mat-label>
    <mat-select [formControlName]="field.name">
      <mat-option *ngFor="let option of field.options" [value]="option.key">
        {{ option.value }}
      </mat-option>
    </mat-select>
    <mat-error *ngIf="form.get(field.name)?.invalid">
      {{ getErrorMessage() }}
    </mat-error>
  </mat-form-field>

  <app-checkbox-group *ngSwitchCase="'checkbox'" [label]="field.label" [options]="field.options" [form]="form" [controlName]="field.name"></app-checkbox-group>
  
  <app-checkbox-group *ngSwitchCase="'checkbox-form'" [label]="field.label" [options]="field.options" [form]="form" [controlName]="field.name"></app-checkbox-group>
  
  <div *ngSwitchCase="'radio'">
    <label>{{ field.label }}</label>
    <mat-radio-group [formControlName]="field.name">
      <div *ngFor="let option of field.options">
          <mat-radio-button [value]="option.key" >
            {{ option.value }}
          </mat-radio-button>
      </div>
    </mat-radio-group>
    
    <mat-error *ngIf="form.get(field.name)?.invalid">
      {{ getErrorMessage() }}
    </mat-error>
  </div>
</ng-container>
